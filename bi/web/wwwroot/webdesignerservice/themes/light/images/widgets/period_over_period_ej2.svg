<svg width="48"
     height="48"
     viewBox="0 0 48 48"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Calendar -->
  <rect x="8"
        y="10"
        width="32"
        height="28"
        rx="5"
        stroke="#0787FF"
        stroke-width="1.6"/>

  <!-- Header -->
  <path d="M8 15
           C8 12.24 10.24 10 13 10
           H35
           C37.76 10 40 12.24 40 15
           V17
           H8
           V15Z"
        fill="#0787FF"/>

  <!-- Calendar Pins -->
  <line x1="15"
        y1="8"
        x2="15"
        y2="14"
        stroke="#0787FF"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <line x1="33"
        y1="8"
        x2="33"
        y2="14"
        stroke="#0787FF"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- Left Period -->
  <rect x="12"
        y="22"
        width="8"
        height="8"
        rx="2"
        fill="#0787FF"
        opacity="0.2"/>

  <rect x="14"
        y="24"
        width="4"
        height="4"
        rx="1"
        fill="#0787FF"/>

  <!-- Right Period -->
  <rect x="28"
        y="22"
        width="8"
        height="8"
        rx="2"
        fill="#F25858"
        opacity="0.2"/>

  <rect x="30"
        y="24"
        width="4"
        height="4"
        rx="1"
        fill="#F25858"/>

  <!-- Comparison Arrow -->
  <path d="M21 26H27"
        stroke="#222733"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <path d="M25 24L27 26L25 28"
        stroke="#222733"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>