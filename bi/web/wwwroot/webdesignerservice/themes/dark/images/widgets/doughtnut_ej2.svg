<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Base Ring -->
  <circle cx="24"
          cy="24"
          r="13"
          stroke="#B8B8B8"
          stroke-width="6"
          fill="none"/>

  <!-- Blue Segment -->
  <circle cx="24"
          cy="24"
          r="13"
